worker_processes 1;
events { worker_connections 1024; }
http {
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
  log_format flowops '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log flowops;

  upstream flowops_app { server app:8000; }
  upstream flowops_grafana { server grafana:3000; }
  upstream flowops_sink { server webhook-sink:8080; }

  server {
    listen 80;
    location /grafana/ {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Prefix /grafana;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://flowops_grafana/;
    }
    location /sink/ { proxy_pass http://flowops_sink/; proxy_set_header Host $host; }
    location / { proxy_pass http://flowops_app; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  }
}
