name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: pytest -q

  docker-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the PostgreSQL demo stack
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Show service status
        run: docker compose ps
      - name: Verify API health and PostgreSQL-backed intake
        run: |
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/health
          response="$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 \
            -H 'Content-Type: application/json' \
            -d '{"userId":7,"id":9901,"title":"VPN outage - all users cannot work","completed":false}' \
            http://127.0.0.1:8000/tickets)"
          echo "$response"
          echo "$response" | grep -q '"priority":"urgent"'
          echo "$response" | grep -q '"queue":"it-network"'
      - name: Collect service logs
        if: always()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  postgres-idempotency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flowops
          POSTGRES_USER: flowops
          POSTGRES_PASSWORD: flowops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowops -d flowops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run PostgreSQL fencing tests
        env:
          FLOWOPS_TEST_POSTGRES_URL: postgresql+psycopg://flowops:flowops@127.0.0.1:5432/flowops
        run: pytest -q tests/test_idempotency_postgres.py
