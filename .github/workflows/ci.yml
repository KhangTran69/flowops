name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Check for merge conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>|\|\|\|\|\|\|\|)' -- .; then
            echo "Merge conflict markers found in tracked files." >&2
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check database migrations
        env:
          FLOWOPS_DATABASE_URL: sqlite:///data/migration-check.db
        run: |
          alembic upgrade head
          alembic upgrade head
      - name: Run offline tests
        run: pytest -q
      - name: Check OpenAPI snapshot (public API surface unchanged)
        run: |
          python scripts/dump_openapi.py /tmp/openapi.current.json
          if ! diff -u tests/openapi_snapshot.json /tmp/openapi.current.json; then
            echo "::error::The OpenAPI surface changed. If intentional, regenerate the snapshot in the same PR: python scripts/dump_openapi.py tests/openapi_snapshot.json" >&2
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Coverage floor (83%)
        run: ./scripts/coverage.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff (E,F,I,B,UP @140, py310 target)
        run: ruff check src tests scripts
      - name: Pre-commit hooks (local mirror of CI checks)
        run: pre-commit run --all-files

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Mypy (allowlist ratchet)
        run: mypy src/definitions.py src/expressions.py src/graph.py src/jobs.py src/outbox.py src/ticket_processor.py

  docker-postgres:
    # ubuntu-24.04 pin, same as console-browser: the screenshot step's
    # Playwright 1.51 has no chromium build for ubuntu-26.04 runners.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate development compose configuration
        run: docker compose -f docker-compose.base44.yml config --quiet
      - name: Build and start the PostgreSQL demo stack
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Show service status
        run: docker compose ps
      - name: Verify API health and PostgreSQL-backed intake
        run: |
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/health
          response="$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 \
            -H 'Content-Type: application/json' \
            -d '{"userId":7,"id":9901,"title":"VPN outage - all users cannot work","completed":false}' \
            http://127.0.0.1:8000/tickets)"
          echo "$response"
          echo "$response" | grep -q '"priority":"urgent"'
          echo "$response" | grep -q '"queue":"it-network"'
      - name: Seed the demo dataset and assert key rows
        run: |
          docker compose exec -T app python -m scripts.seed_demo
          # A second run must be a no-op (idempotency of the seed itself).
          docker compose exec -T app python -m scripts.seed_demo | grep -q 'already present'
          docker compose exec -T postgres psql -U flowops -d flowops -tAc \
            "SELECT count(*) FROM tickets WHERE tenant_key = 'demo'" | grep -qx '30'
          docker compose exec -T postgres psql -U flowops -d flowops -tAc \
            "SELECT count(*) FROM workflow_runs" | grep -qx '2'
          docker compose exec -T postgres psql -U flowops -d flowops -tAc \
            "SELECT count(*) FROM workflow_jobs WHERE status = 'failed'" | grep -qx '1'
          docker compose exec -T postgres psql -U flowops -d flowops -tAc \
            "SELECT count(*) FROM notification_outbox WHERE status = 'failed'" | grep -qx '1'
      - name: Run the guided demo journey
        run: ./scripts/demo_smoke.sh --journey
      - name: Capture demo screenshots
        run: |
          python -m pip install --quiet playwright==1.51.0
          python -m playwright install --with-deps chromium
          python scripts/capture_demo_screenshots.py
      - name: Upload demo screenshots
        uses: actions/upload-artifact@v4
        with:
          name: demo-screenshots
          path: docs/assets/*.png
          if-no-files-found: error
      - name: Backup-restore rehearsal
        run: ./scripts/backup_restore_rehearsal.sh
      - name: Upload backup-restore rehearsal evidence
        uses: actions/upload-artifact@v4
        with:
          name: backup-restore-timings
          path: backup-restore-timings.txt
          if-no-files-found: error

      - name: Collect service logs
        if: always()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  postgres-idempotency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flowops
          POSTGRES_USER: flowops
          POSTGRES_PASSWORD: flowops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowops -d flowops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run PostgreSQL migrations
        env:
          FLOWOPS_DATABASE_URL: postgresql+psycopg://flowops:flowops@127.0.0.1:5432/flowops
        run: alembic upgrade head
      - name: Validate manual ticket migration rollback
        env:
          FLOWOPS_DATABASE_URL: postgresql+psycopg://flowops:flowops@127.0.0.1:5432/flowops
          FLOWOPS_DISPOSABLE_MIGRATION_CHECK: '1'
        run: python -m scripts.check_manual_ticket_migration
      - name: Run PostgreSQL reliability tests
        env:
          FLOWOPS_TEST_POSTGRES_URL: postgresql+psycopg://flowops:flowops@127.0.0.1:5432/flowops
        run: |
          pytest -q tests/test_idempotency_postgres.py tests/test_outbox_postgres.py \
            tests/test_jobs_postgres.py tests/test_outbox_worker_postgres.py \
            tests/test_offboarding_postgres.py tests/test_ai_postgres.py tests/test_orchestrator_postgres.py tests/test_v13_postgres.py tests/test_triggers_postgres.py

      - name: Benchmark disposable PostgreSQL workload
        env:
          FLOWOPS_DATABASE_URL: postgresql+psycopg://flowops:flowops@127.0.0.1:5432/flowops
          FLOWOPS_DISPOSABLE_BENCHMARK: '1'
          FLOWOPS_BENCHMARK_REPORT: benchmark-console.json
          FLOWOPS_AUTH_REQUIRED: 'false'
          FLOWOPS_UI_AUTH_REQUIRED: 'false'
          FLOWOPS_ENVIRONMENT: development
          FLOWOPS_ACTION_ADAPTER: simulated
          FLOWOPS_AI_ADAPTER: simulated
          FLOWOPS_AUTOMATION_ADAPTER: simulated
        run: |
          alembic upgrade head
          python -m scripts.benchmark_console
      - name: Upload PostgreSQL benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-console-benchmark
          path: benchmark-console.json
          if-no-files-found: warn

  command-center:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: command-center
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: command-center/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --check server/index.mjs
      - run: node --test server/*.test.mjs
      - run: node --experimental-strip-types --test tests/contracts.test.mjs
      - name: Fail on moderate or higher dependency advisories
        run: npm audit --audit-level=moderate


  console-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: command-center/package-lock.json
      - run: python -m pip install -r requirements-dev.txt playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - name: Install isolated accessibility test dependency
        run: npm install --prefix /tmp/flowops-axe --no-package-lock --ignore-scripts axe-core@4.10.3
      - run: npm ci && npm run build
        working-directory: command-center
      - name: Exercise isolated browser and backend
        env:
          FLOWOPS_DATABASE_URL: sqlite:///data/console-browser.db
          FLOWOPS_ENVIRONMENT: development
          FLOWOPS_AUTH_REQUIRED: 'false'
          FLOWOPS_UI_AUTH_REQUIRED: 'false'
          FLOWOPS_ACTION_ADAPTER: simulated
          FLOWOPS_AI_ADAPTER: simulated
          FLOWOPS_AUTOMATION_ADAPTER: simulated
          FLOWOPS_API_URL: http://127.0.0.1:8000
          FLOWOPS_API_TOKEN: local-browser-test
          FLOWOPS_COMMAND_CENTER_DEV: 'true'
          DEV_USER_ROLE: admin
          SERVE_STATIC: 'true'
          FLOWOPS_AXE_PATH: /tmp/flowops-axe/node_modules/axe-core/axe.min.js
        run: |
          alembic upgrade head
          python -m uvicorn src.api:app --host 127.0.0.1 --port 8000 > /tmp/flowops-api.log 2>&1 &
          api_pid=$!
          node command-center/server/index.mjs > /tmp/flowops-console.log 2>&1 &
          console_pid=$!
          trap 'kill "$api_pid" "$console_pid" 2>/dev/null || true; cat /tmp/flowops-api.log /tmp/flowops-console.log' EXIT
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/ready
          python command-center/tests/browser_smoke.py

      - name: Exercise protected browser session with synthetic credentials
        env:
          FLOWOPS_DATABASE_URL: sqlite:///data/console-auth-browser.db
          FLOWOPS_ENVIRONMENT: development
          FLOWOPS_AUTH_REQUIRED: 'true'
          FLOWOPS_UI_AUTH_REQUIRED: 'true'
          FLOWOPS_SESSION_COOKIE_SECURE: 'false'
          FLOWOPS_ACTION_ADAPTER: simulated
          FLOWOPS_AI_ADAPTER: simulated
          FLOWOPS_AUTOMATION_ADAPTER: simulated
          FLOWOPS_API_URL: http://127.0.0.1:8000
          FLOWOPS_COMMAND_CENTER_DEV: 'false'
          NODE_ENV: production
          FLOWOPS_DEV_TENANT_KEY: browser-test
        run: |
          export FLOWOPS_SESSION_SECRET="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          export FLOWOPS_DEV_BEARER_TOKEN="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          export FLOWOPS_BROWSER_TEST_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          export FLOWOPS_DEMO_USERS="$(python -c 'import json, os; from src.ui_session import hash_demo_password; print(json.dumps({"ci-operator": {"password_hash": hash_demo_password(os.environ["FLOWOPS_BROWSER_TEST_PASSWORD"]), "roles": ["automation.operator"], "tenant_key": "browser-test"}}))')"
          alembic upgrade head
          python -m uvicorn src.api:app --host 127.0.0.1 --port 8000 > /tmp/flowops-auth-api.log 2>&1 &
          api_pid=$!
          node command-center/server/index.mjs > /tmp/flowops-auth-console.log 2>&1 &
          console_pid=$!
          trap 'kill "$api_pid" "$console_pid" 2>/dev/null || true; cat /tmp/flowops-auth-api.log /tmp/flowops-auth-console.log' EXIT
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/ready
          python command-center/tests/browser_auth.py


  monitoring-rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate example Prometheus rules
        run: |
          docker run --rm -v "$PWD/monitoring:/rules:ro" --entrypoint /bin/promtool prom/prometheus:v3.5.0 check rules /rules/flowops-alerts.yml
          docker run --rm -v "$PWD/monitoring:/rules:ro" --entrypoint /bin/promtool prom/prometheus:v3.5.0 test rules /rules/flowops-alerts.test.yml
