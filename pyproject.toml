[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = ["migrations/versions", "command-center"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection helpers are immutable and idiomatic in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path",
  "fastapi.Body", "fastapi.Header", "fastapi.Cookie", "fastapi.Form",
  "fastapi.File", "fastapi.Security",
  # FastAPI dependency factory (src/routes/workforce.py): returns a Depends
  # closure; calling it in a default is the idiomatic DI pattern.
  "src.routes.workforce.role_actor"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["migrations/versions", "command-center"]
