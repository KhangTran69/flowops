# Base44 development compose for FlowOps.
# Runs the app from bind-mounted source with live reload on port 3000.
x-flowops-env: &flowops-env
  FLOWOPS_DATABASE_URL: postgresql+psycopg://flowops:flowops@postgres:5432/flowops
  FLOWOPS_ENVIRONMENT: development
  FLOWOPS_AUTH_REQUIRED: "false"
  FLOWOPS_UI_AUTH_REQUIRED: "false"
  FLOWOPS_SESSION_COOKIE_SECURE: "false"
  FLOWOPS_ACTION_ADAPTER: simulated
  FLOWOPS_AI_ADAPTER: simulated
  FLOWOPS_NOTIFICATION_WEBHOOK_URL: http://webhook-sink:8080/webhook
  FLOWOPS_ACTION_FAILURE_WEBHOOK_URL: http://webhook-sink:8080/webhook
  FLOWOPS_NOTIFICATION_MAX_ATTEMPTS: "5"
  FLOWOPS_DAG_MAX_PARALLEL: "4"
  FLOWOPS_DAG_LEASE_SECONDS: "60"
  FLOWOPS_DAG_SCHEDULER_INTERVAL: "2"
  FLOWOPS_TIMER_INTERVAL: "2"
  FLOWOPS_RATE_LIMIT_PER_MINUTE: "0"

services:
  postgres:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_DB: flowops
      POSTGRES_USER: flowops
      POSTGRES_PASSWORD: flowops
    volumes:
      - flowops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowops -d flowops"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: python:3.13-slim
    restart: on-failure
    stop_grace_period: 15s
    ports:
      - "3000:8000"
    environment:
      <<: *flowops-env
      FLOWOPS_RUN_MIGRATIONS: "true"
    volumes:
      - .:/app
    working_dir: /app
    command:
      ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && alembic upgrade head && exec uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload --reload-dir src"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 40s

  worker:
    image: python:3.13-slim
    restart: on-failure
    stop_grace_period: 15s
    environment:
      <<: *flowops-env
      FLOWOPS_RUN_MIGRATIONS: "false"
    volumes:
      - .:/app
    working_dir: /app
    command:
      ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && exec python -m src.worker --poll-interval 2"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.kill(1,0)\""]
      interval: 10s
      timeout: 3s
      retries: 3

  scheduler:
    image: python:3.13-slim
    restart: on-failure
    stop_grace_period: 15s
    environment:
      <<: *flowops-env
      FLOWOPS_RUN_MIGRATIONS: "false"
    volumes:
      - .:/app
    working_dir: /app
    command:
      ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && exec python -m src.scheduler --poll --interval 2"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.kill(1,0)\""]
      interval: 10s
      timeout: 3s
      retries: 3

  timers:
    image: python:3.13-slim
    restart: on-failure
    stop_grace_period: 15s
    environment:
      <<: *flowops-env
      FLOWOPS_RUN_MIGRATIONS: "false"
    volumes:
      - .:/app
    working_dir: /app
    command:
      ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && exec python -m src.timers --poll --interval 2"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.kill(1,0)\""]
      interval: 10s
      timeout: 3s
      retries: 3

  outbox:
    image: python:3.13-slim
    restart: on-failure
    stop_grace_period: 15s
    environment:
      <<: *flowops-env
      FLOWOPS_RUN_MIGRATIONS: "false"
    volumes:
      - .:/app
    working_dir: /app
    command:
      ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && exec python -m src.outbox_worker --poll-interval 2"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.kill(1,0)\""]
      interval: 10s
      timeout: 3s
      retries: 3

  webhook-sink:
    build: ./docker/webhook-sink
    restart: on-failure
    healthcheck:
      test:
        ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  flowops-postgres:
