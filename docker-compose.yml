services:
  app:
    build: .
    ports:
      - "${FLOWOPS_APP_PORT:-8000}:8000"
    environment:
      FLOWOPS_DATABASE_URL: postgresql+psycopg://flowops:flowops@postgres:5432/flowops
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowops
      POSTGRES_USER: flowops
      POSTGRES_PASSWORD: flowops
    volumes:
      - flowops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowops -d flowops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flowops-postgres:
