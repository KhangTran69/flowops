x-flowops-env: &flowops-env
  FLOWOPS_DATABASE_URL: postgresql+psycopg://flowops:flowops@postgres:5432/flowops
  FLOWOPS_ENVIRONMENT: ${FLOWOPS_ENVIRONMENT:-development}
  FLOWOPS_AUTH_REQUIRED: ${FLOWOPS_AUTH_REQUIRED:-false}
  FLOWOPS_UI_AUTH_REQUIRED: ${FLOWOPS_UI_AUTH_REQUIRED:-false}
  FLOWOPS_SESSION_SECRET: ${FLOWOPS_SESSION_SECRET:-}
  FLOWOPS_SESSION_MAX_AGE_SECONDS: ${FLOWOPS_SESSION_MAX_AGE_SECONDS:-3600}
  FLOWOPS_SESSION_COOKIE_SECURE: ${FLOWOPS_SESSION_COOKIE_SECURE:-false}
  FLOWOPS_DEV_BEARER_TOKEN: ${FLOWOPS_DEV_BEARER_TOKEN:-}
  FLOWOPS_ENTRA_ISSUER: ${FLOWOPS_ENTRA_ISSUER:-}
  FLOWOPS_ENTRA_AUDIENCE: ${FLOWOPS_ENTRA_AUDIENCE:-}
  FLOWOPS_ENTRA_JWKS_URL: ${FLOWOPS_ENTRA_JWKS_URL:-}
  FLOWOPS_ENTRA_REQUIRED_ROLE: ${FLOWOPS_ENTRA_REQUIRED_ROLE:-automation.operator}
  FLOWOPS_WEBHOOK_API_KEY: ${FLOWOPS_WEBHOOK_API_KEY:-}
  FLOWOPS_CHATOPS_SECRET: ${FLOWOPS_CHATOPS_SECRET:-}
  FLOWOPS_DAG_MAX_PARALLEL: ${FLOWOPS_DAG_MAX_PARALLEL:-4}
  FLOWOPS_DAG_LEASE_SECONDS: ${FLOWOPS_DAG_LEASE_SECONDS:-60}
  FLOWOPS_DAG_SCHEDULER_INTERVAL: ${FLOWOPS_DAG_SCHEDULER_INTERVAL:-2}
  FLOWOPS_TIMER_INTERVAL: ${FLOWOPS_TIMER_INTERVAL:-2}
  FLOWOPS_ESCALATION_WEBHOOK_URL: ${FLOWOPS_ESCALATION_WEBHOOK_URL:-}
  FLOWOPS_ACTION_ADAPTER: ${FLOWOPS_ACTION_ADAPTER:-simulated}
  FLOWOPS_POWER_AUTOMATE_URL: ${FLOWOPS_POWER_AUTOMATE_URL:-}
  FLOWOPS_GRAPH_URL: ${FLOWOPS_GRAPH_URL:-https://graph.microsoft.com/v1.0}
  FLOWOPS_GRAPH_ACCESS_TOKEN: ${FLOWOPS_GRAPH_ACCESS_TOKEN:-}
  FLOWOPS_GRAPH_CLIENT_ID: ${FLOWOPS_GRAPH_CLIENT_ID:-}
  FLOWOPS_GRAPH_CLIENT_SECRET: ${FLOWOPS_GRAPH_CLIENT_SECRET:-}
  FLOWOPS_GRAPH_TENANT_ID: ${FLOWOPS_GRAPH_TENANT_ID:-}
  FLOWOPS_GRAPH_DEFAULT_SKU: ${FLOWOPS_GRAPH_DEFAULT_SKU:-O365_BUSINESS_PREMIUM}
  FLOWOPS_GRAPH_USAGE_LOCATION: ${FLOWOPS_GRAPH_USAGE_LOCATION:-}
  FLOWOPS_CW_SITE: ${FLOWOPS_CW_SITE:-}
  FLOWOPS_CW_COMPANY_ID: ${FLOWOPS_CW_COMPANY_ID:-}
  FLOWOPS_CW_PUBLIC_KEY: ${FLOWOPS_CW_PUBLIC_KEY:-}
  FLOWOPS_CW_PRIVATE_KEY: ${FLOWOPS_CW_PRIVATE_KEY:-}
  FLOWOPS_CW_CLIENT_ID: ${FLOWOPS_CW_CLIENT_ID:-}
  FLOWOPS_ACTION_RETRIES: ${FLOWOPS_ACTION_RETRIES:-{}}
  FLOWOPS_NOTIFICATION_WEBHOOK_URL: ${FLOWOPS_NOTIFICATION_WEBHOOK_URL:-http://webhook-sink:8080/webhook}
  FLOWOPS_ACTION_FAILURE_WEBHOOK_URL: ${FLOWOPS_ACTION_FAILURE_WEBHOOK_URL:-http://webhook-sink:8080/webhook}
  FLOWOPS_NOTIFICATION_MAX_ATTEMPTS: ${FLOWOPS_NOTIFICATION_MAX_ATTEMPTS:-5}
  FLOWOPS_RATE_LIMIT_PER_MINUTE: ${FLOWOPS_RATE_LIMIT_PER_MINUTE:-0}
  FLOWOPS_AI_ADAPTER: ${FLOWOPS_AI_ADAPTER:-simulated}
  FLOWOPS_AI_API_KEY: ${FLOWOPS_AI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  FLOWOPS_AI_BASE_URL: ${FLOWOPS_AI_BASE_URL:-}
  FLOWOPS_AI_MODEL: ${FLOWOPS_AI_MODEL:-}
  FLOWOPS_AI_TIMEOUT: ${FLOWOPS_AI_TIMEOUT:-30}

services:
  app:
    build: .
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "${FLOWOPS_APP_PORT:-8000}:8000"
    environment:
      <<: *flowops-env
      FLOWOPS_RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 8s

  worker:
    build: .
    restart: unless-stopped
    stop_grace_period: 15s
    command: ["python", "-m", "src.worker", "--poll-interval", "2"]
    environment:
      <<: *flowops-env
      FLOWOPS_RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'src.worker' >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3

  scheduler:
    build: .
    restart: unless-stopped
    stop_grace_period: 15s
    command: ["python", "-m", "src.scheduler", "--poll", "--interval", "${FLOWOPS_DAG_SCHEDULER_INTERVAL:-2}"]
    environment:
      <<: *flowops-env
      FLOWOPS_RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'src.scheduler' >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3

  timers:
    build: .
    restart: unless-stopped
    stop_grace_period: 15s
    command: ["python", "-m", "src.timers", "--poll", "--interval", "${FLOWOPS_TIMER_INTERVAL:-2}"]
    environment:
      <<: *flowops-env
      FLOWOPS_RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'src.timers' >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3

  outbox:
    build: .
    restart: unless-stopped
    stop_grace_period: 15s
    command: ["python", "-m", "src.outbox_worker", "--poll-interval", "2"]
    environment:
      <<: *flowops-env
      FLOWOPS_RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'src.outbox_worker' >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3

  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${FLOWOPS_GATEWAY_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
      grafana:
        condition: service_healthy
      webhook-sink:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  webhook-sink:
    build: ./docker/webhook-sink
    restart: unless-stopped
    ports:
      - "${FLOWOPS_WEBHOOK_SINK_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    ports:
      - "${FLOWOPS_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    ports:
      - "${FLOWOPS_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${FLOWOPS_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${FLOWOPS_GRAFANA_ADMIN_PASSWORD:-flowops-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - flowops-grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  test-postgres:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: flowops_test
      POSTGRES_USER: flowops
      POSTGRES_PASSWORD: flowops
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowops -d flowops_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  test-runner:
    build: .
    profiles: ["test"]
    environment:
      FLOWOPS_DATABASE_URL: postgresql+psycopg://flowops:flowops@test-postgres:5432/flowops_test
      FLOWOPS_TEST_POSTGRES_URL: postgresql+psycopg://flowops:flowops@test-postgres:5432/flowops_test
      FLOWOPS_ENVIRONMENT: development
      FLOWOPS_AUTH_REQUIRED: "false"
      FLOWOPS_RUN_MIGRATIONS: "true"
    depends_on:
      test-postgres:
        condition: service_healthy
    command: ["pytest", "-q"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowops
      POSTGRES_USER: flowops
      POSTGRES_PASSWORD: flowops
    volumes:
      - flowops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowops -d flowops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flowops-postgres:
  flowops-grafana:
