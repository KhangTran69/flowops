services:
  app:
    build: .
    ports:
      - "${FLOWOPS_APP_PORT:-8000}:8000"
    environment:
      FLOWOPS_DATABASE_URL: postgresql+psycopg://flowops:flowops@postgres:5432/flowops
      FLOWOPS_AUTH_REQUIRED: ${FLOWOPS_AUTH_REQUIRED:-false}
      FLOWOPS_DEV_BEARER_TOKEN: ${FLOWOPS_DEV_BEARER_TOKEN:-}
      FLOWOPS_DEV_BEARER_TOKEN: ${FLOWOPS_DEV_BEARER_TOKEN:-}
      FLOWOPS_ACTION_ADAPTER: ${FLOWOPS_ACTION_ADAPTER:-simulated}
      FLOWOPS_POWER_AUTOMATE_URL: ${FLOWOPS_POWER_AUTOMATE_URL:-}
      FLOWOPS_GRAPH_URL: ${FLOWOPS_GRAPH_URL:-https://graph.microsoft.com/v1.0}
      FLOWOPS_GRAPH_ACCESS_TOKEN: ${FLOWOPS_GRAPH_ACCESS_TOKEN:-}
      FLOWOPS_ACTION_RETRIES: ${FLOWOPS_ACTION_RETRIES:-{}}
      FLOWOPS_ACTION_FAILURE_WEBHOOK_URL: ${FLOWOPS_ACTION_FAILURE_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowops
      POSTGRES_USER: flowops
      POSTGRES_PASSWORD: flowops
    volumes:
      - flowops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowops -d flowops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flowops-postgres:
