{% extends "base.html" %}
{% block title %}Sign in — FlowOps{% endblock %}
{% block content %}
<section class="page-heading">
  <div>
    <span class="eyebrow">Operator console</span>
    <h1>Sign in</h1>
    <p class="muted">Sign in with the admin account.</p>
  </div>
</section>
<section class="panel" style="max-width: 34rem;">
  {% if error %}<p class="empty fail" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field">
      <span>Username</span>
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <div class="toolbar" style="margin-top: 0.9rem;">
      <button class="button primary" type="submit">Sign in</button>
      <a class="button ghost" href="/">Home</a>
    </div>
  </form>
</section>
{% endblock %}
